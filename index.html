<!DOCTYPE html>
<!--
	whl.ltd — the front door of Wanted Hacker Limited.

	One page, no build step, no dependencies. The background is a random SVG
	gradient, rolled fresh on every load — the house question, IS LIFE A RANDOM
	GRADIENT?, answered by the front door itself. The layout borrows the WHL
	Colours Gradient tool: readout top-left showing the gradient's true
	parameters, the works listed down the right, one line of copyright at the
	bottom. Ink flips black or white per region, judged against the gradient
	behind it, the way the tool judges its own paper.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WHL — Wanted Hacker Limited</title>
<style>
/* The typeface is the licensed Berkeley Mono web font, served from beside the
	 Gradient tool so the file exists once in the repository. Machines with the
	 desktop family installed resolve it locally; everyone else falls through
	 the stack gracefully. */
@font-face{
	font-family:"Berkeley Mono Web";
	src:url(colours/gradient/berkeley.woff2) format("woff2");
	font-display:swap;
}
*{margin:0; padding:0; box-sizing:border-box; border-radius:0}
/* Set like a terminal: one font, one size, hierarchy from whitespace and ink
	 strength alone. No lines, no shadows, no second size. */
body{
	font-family:"Berkeley Mono Variable","Berkeley Mono","Berkeley Mono Web","IBM Plex Mono",ui-monospace,monospace;
	font-size:0.75rem; line-height:1.5;
	color:#fff; background:#111;
	min-height:100vh; min-height:100dvh;
	display:grid;
	grid-template-columns:1fr 252px;
	grid-template-rows:1fr auto;
	padding:15px;
}
/* The render is the page. The SVG sits behind everything, full bleed. */
#canvas{position:fixed; inset:0; z-index:-1}
#canvas svg{width:100%; height:100%; display:block}
#hud{grid-column:1; grid-row:1; white-space:pre; user-select:text}
#hud::first-line{font-weight:500}
#list{grid-column:2; grid-row:1 / span 2; justify-self:end; text-align:left}
#list p{margin-bottom:18px}
#copy{grid-column:1; grid-row:2; align-self:end}
a{color:inherit; text-decoration:none}
a:hover{text-decoration:underline}
.quiet{opacity:.55}
.ink-dark{color:#111}
/* On a phone the columns give way to a stack: readout, then the works, the
	 copyright holding the floor. */
@media (max-width:720px){
	body{grid-template-columns:1fr; grid-template-rows:auto auto 1fr}
	#list{grid-column:1; grid-row:2; justify-self:start; margin-top:36px}
	#copy{grid-row:3}
}
</style>
</head>
<body>

<div id="canvas"></div>

<div id="hud"></div>

<nav id="list">
	<p><a href="colours/gradient/">WHL COLOURS GRADIENT</a></p>
	<p class="quiet">WHL COLOURS PALETTE</p>
	<p><a href="https://imightfeel.ai">I MIGHT FEEL . AI</a></p>
</nav>

<div id="copy">© 2026 Wanted Hacker Limited · whl.ltd</div>

<script>
"use strict"
/* One random gradient per visit. Hues stay adjacent, lightness climbs dark to
	 light — the same civil ranges the Gradient tool rolls with, minus the
	 colour-science machinery a front door does not need. */
function rand( a, b ){ return a + Math.random() * ( b - a ) }
function channel( v ){
	const s = Math.round( Math.max( 0, Math.min( 255, v * 255 ) ) ).toString( 16 )
	return s.length < 2 ? "0" + s : s
}
function hslToRgb( h, s, l ){
	const f = function( n ){
		const k = ( n + h / 30 ) % 12
		return l - s * Math.min( l, 1 - l ) * Math.max( -1, Math.min( k - 3, 9 - k, 1 ) )
	}
	return [ f( 0 ), f( 8 ), f( 4 ) ]
}
const count = Math.random() < 0.4 ? 2 : 3
const drift = rand( 18, 42 ) * ( Math.random() < 0.5 ? -1 : 1 )
const hue = rand( 0, 360 )
const dark = rand( 0.14, 0.30 ), light = rand( 0.68, 0.86 )
const stops = []
for( let i = 0; i < count; i++ ){
	const t = count === 1 ? 0 : i / ( count - 1 )
	const rgb = hslToRgb( ( hue + drift * i + 360 ) % 360, rand( 0.40, 0.72 ), dark + ( light - dark ) * t )
	stops.push( { at: Math.round( t * 100 ), rgb: rgb, hex: "#" + channel( rgb[0] ) + channel( rgb[1] ) + channel( rgb[2] ) } )
}
const angle = Math.round( rand( 0, 360 ) )

/* The SVG mirrors the tool's geometry: CSS angle convention, endpoints set to
	 cover the frame, slice scaling so the gradient owns every pixel. */
const rad = angle * Math.PI / 180
const dx = Math.sin( rad ), dy = -Math.cos( rad )
const half = ( Math.abs( dx ) * 100 + Math.abs( dy ) * 100 ) / 2
const svgStops = stops.map( function( s ){
	return '<stop offset="' + s.at + '%" stop-color="' + s.hex.toUpperCase() + '"/>'
} ).join( "" )
document.getElementById( "canvas" ).innerHTML =
	'<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">' +
	'<defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="' + ( 50 - dx * half ) + '" y1="' + ( 50 - dy * half ) +
	'" x2="' + ( 50 + dx * half ) + '" y2="' + ( 50 + dy * half ) + '">' + svgStops +
	'</linearGradient></defs><rect width="100" height="100" fill="url(#g)"/></svg>'

/* The readout tells the truth about the gradient behind it, the way the tool
	 does: stops, then type and angle. */
const lines = [ "WHL · WANTED HACKER LIMITED", "" ]
stops.forEach( function( s ){ lines.push( s.hex.toUpperCase() + " · " + s.at + "%" ) } )
lines.push( "LINEAR · " + angle + "°" )
document.getElementById( "hud" ).textContent = lines.join( "\n" )

/* Each region judges its own ground. The point is mapped onto the gradient
	 axis, the colour interpolated in sRGB — close enough to choose an ink —
	 and the ink flips black when the ground is light. */
function colourAt( px, py ){
	const w = window.innerWidth, h = window.innerHeight
	const cx = px * w, cy = py * h
	const hl = ( Math.abs( dx ) * w + Math.abs( dy ) * h ) / 2
	const t = Math.max( 0, Math.min( 1, ( ( cx - w / 2 ) * dx + ( cy - h / 2 ) * dy + hl ) / ( 2 * hl ) ) )
	const pos = t * 100
	let a = stops[0], b = stops[stops.length - 1]
	for( let i = 0; i < stops.length - 1; i++ ){
		if( pos >= stops[i].at && pos <= stops[i + 1].at ){ a = stops[i]; b = stops[i + 1]; break }
	}
	const span = Math.max( 1e-6, b.at - a.at )
	const k = Math.max( 0, Math.min( 1, ( pos - a.at ) / span ) )
	return a.rgb.map( function( v, i ){ return v + ( b.rgb[i] - v ) * k } )
}
function luminance( rgb ){
	const lin = rgb.map( function( v ){ return v <= 0.04045 ? v / 12.92 : Math.pow( ( v + 0.055 ) / 1.055, 2.4 ) } )
	return 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2]
}
function tune(){
	[ [ "hud", 0.12, 0.12 ], [ "list", 0.88, 0.30 ], [ "copy", 0.12, 0.94 ] ].forEach( function( spot ){
		document.getElementById( spot[0] ).classList.toggle( "ink-dark", luminance( colourAt( spot[1], spot[2] ) ) > 0.4 )
	} )
}
tune()
window.addEventListener( "resize", tune )
</script>

</body>
</html>
