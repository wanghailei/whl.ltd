<!DOCTYPE html>
<!--
	whl.ltd — the front door of Wanted Hacker Limited.

	One page, no build step, no dependencies. The background is a fresh roll of
	the WHL Colours Gradient engine on every visit — the house question, IS
	LIFE A RANDOM GRADIENT?, answered by the front door itself. There is no
	second gradient algorithm here: the tool itself runs in a hidden
	same-origin iframe, the page asks it to roll (randomAll), lifts the drawn
	SVG straight out of its canvas, and judges ink with the tool's own colour
	sampler. One engine, no copies. The parameters stay the tool's business —
	the front door shows only the name.

	The layout borrows the tool: the title top-left, the works down the right,
	one line of copyright at the bottom — the name on it unfolds the author's
	card above itself, the tool's licence fold borrowed for the person. Content meets every window edge at
	4ch of the page's own type — Hailei's rule for all WHL sites — on every
	screen size.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WHL</title>
<style>
/* The typeface is the licensed Berkeley Mono web font, served from beside the
	 Gradient tool so the file exists once in the repository. Machines with the
	 desktop family installed resolve it locally; everyone else falls through
	 the stack gracefully. */
@font-face{
	font-family:"Berkeley Mono";
	src:url(colours/gradient/berkeley.woff2) format("woff2");
	font-display:swap;
}
*{margin:0; padding:0; box-sizing:border-box; border-radius:0}
/* No Safari rubber-band bounce at scroll ends — Hailei's call for every WHL
	 page (2026-07-28). On the root so the viewport scroller obeys. */
html,body{overscroll-behavior:none}
/* Set like a terminal: one font, one size, hierarchy from whitespace and ink
	 strength alone. No lines, no shadows, no second size. */
body{
	/* Hailei's law for every WHL site: Berkeley Mono, IBM Plex Mono, monospace —
		 one size, one set of weight rules. The @font-face above lets the served
		 woff2 answer to the same name an installed copy would. */
	font-family:"Berkeley Mono","IBM Plex Mono",monospace;
	font-size:0.75rem; line-height:1.5;
	color:#fff; background:#111;
	min-height:100vh; min-height:100dvh;
	display:grid;
	grid-template-columns:1fr 252px;
	grid-template-rows:1fr auto;
	/* Content-to-edge distance in the page's own type: Hailei tried the
		 imightfeel 3ch and judged it too tight here — 4ch is his call
		 (2026-07-28), uniform on every screen size. */
	padding:4ch;
}
/* The render is the page. The engine draws in a hidden viewport-sized iframe;
	 its SVG is lifted into #canvas, full bleed behind everything. */
#engine{position:fixed; inset:0; width:100%; height:100%; border:0; visibility:hidden; pointer-events:none; z-index:-2}
#canvas{position:fixed; inset:0; z-index:-1}
#canvas svg{width:100%; height:100%; display:block}
#lead{grid-column:1; grid-row:1; user-select:text}
/* The site title stands alone — no parameter readout on the front door —
	 and on a phone it stays pinned to the top (Hailei's rule, 2026-07-28).
	 Set Medium, the letters two spaces apart at rest. Each letter is its own
	 span on a track three logo-widths long (the logo is 7ch, so 21ch), and
	 the drift script below animates the same transform these rules set —
	 before the script, and whenever the physics sleeps, this IS the title. */
#title{font-weight:500; position:relative; width:21ch; height:1.5em}
#title span{position:absolute; left:0; top:0; will-change:transform}
#title span:nth-child(2){transform:translateX(3ch)}
#title span:nth-child(3){transform:translateX(6ch)}

#list{grid-column:2; grid-row:1 / span 2; justify-self:end; text-align:left}
#list p{margin-bottom:18px}
#copy{grid-column:1; grid-row:2; align-self:end}
/* The author's card unfolds above the copyright line — the tool's licence
	 fold, borrowed for the person behind the house. Bare on the render like
	 everything else, its ink judged against its own stretch of the gradient.
	 Its door is the card's first line — the Carbon close icon at 16px, as
	 every icon in the house is — with a blank line before the text
	 (Hailei, 2026-07-29). */
#bio{margin-bottom:18px; max-width:56ch}
#bio p{margin-bottom:18px}
#bio p:last-child{margin-bottom:0}
#bioClose{display:block; background:none; border:0; padding:0;
	color:inherit; cursor:pointer; opacity:.55; margin-bottom:18px}
#bioClose:hover{opacity:1}
#bioClose svg{display:block; width:16px; height:16px}
/* The name in the copyright line is the card's handle — a button dressed as
	 plain text, as every control in the house is. */
#bioName{background:none; border:0; padding:0; font:inherit; color:inherit; cursor:pointer}
#bioName:hover{text-decoration:underline}
.hidden{display:none}
a{color:inherit; text-decoration:none}
a:hover{text-decoration:underline}
.ink-dark{color:#111}
/* On a phone the columns give way to a stack — title, then the works, the
	 copyright holding the floor. The page margin stays 4ch on every screen. */
@media (max-width:720px){
	body{padding:4ch; grid-template-columns:1fr; grid-template-rows:auto auto 1fr}
	#list{grid-column:1; grid-row:2; justify-self:start; margin-top:36px}
	#copy{grid-row:3}
	#title{position:sticky; top:4ch; z-index:30}
}
</style>
</head>
<body>

<iframe id="engine" src="colours/gradient/" title="WHL Colours Gradient engine"></iframe>
<div id="canvas"></div>

<div id="lead"><div id="title"><span>W</span><span>H</span><span>L</span></div></div>

<nav id="list">
	<p><a href="colours/gradient/" target="_blank" rel="noopener">WHL COLOURS GRADIENT</a></p>
	<p><a href="colours/palette/" target="_blank" rel="noopener">WHL COLOURS PALETTE</a></p>
	<p><a href="https://imightfeel.ai" target="_blank" rel="noopener">i might feel . ai</a></p>
</nav>

<div id="copy">
	<div id="bio" class="hidden">
		<button id="bioClose" type="button" aria-label="close"><svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M24 9.4 22.6 8 16 14.6 9.4 8 8 9.4 14.6 16 8 22.6 9.4 24 16 17.4 22.6 24 24 22.6 17.4 16z"/></svg></button>
		<p>Wang Hai Lei / 王海磊</p>
		<p>a designer, programmer, artist and entrepreneur.</p>
		<p><a href="mailto:wanghailei@gmail.com">wanghailei@gmail.com</a></p>
	</div>
	© 2026 Wanted Hacker Limited / <button id="bioName" type="button">Wang Hai Lei</button>
</div>

<script>
"use strict"
/* The engine iframe fills the viewport, so the tool draws at exactly this
	 window's ratio (its Window size mode). Once loaded: roll, lift, judge.
	 Everything below leans on the tool — randomAll and renderDims are the
	 tool's own, while the colour sampler now lives in the engine file the tool
	 loads beside itself and answers on WHLGradient. One source of truth either
	 way; only the doorway differs.

	 Scar (2026-08-01): the sampler used to be inline in the tool, so it sat on
	 the iframe's window and w.colourAtPoint worked. Gradient 0.59.0 moved the
	 drawing core into gradient.js behind an IIFE, and these three calls started
	 throwing. The catch below swallowed it, so the render kept appearing and
	 only the ink quietly stopped judging — Hailei spotted it, no error ever
	 surfaced. A silent catch around a hard dependency hides exactly this. */
const frame = document.getElementById( "engine" )
/* Each roll leaves behind a judge for the author's card, so a card opened
	 later answers the gradient actually behind it. */
let judgeCard = null
function roll(){
	try{
		const w = frame.contentWindow
		const doc = frame.contentDocument
		w.randomAll()
		document.getElementById( "canvas" ).innerHTML = doc.getElementById( "canvas" ).innerHTML
		/* The tool lays out at its own minimum width, so on narrow screens its
			 render is wider than this viewport. Cover, never letterbox — the
			 overflow crops away and the judging below maps through the crop. */
		const svg = document.getElementById( "canvas" ).querySelector( "svg" )
		if( svg ) svg.setAttribute( "preserveAspectRatio", "xMidYMid slice" )

		/* Each region judges its own ground with the engine's sampler: nine
			 points, OKLab lightness, dark ink on light paper. Screen points map
			 through the cover-crop into render space. */
		const engine = w.WHLGradient
		const dims = w.renderDims()
		const cover = Math.max( window.innerWidth / dims.w, window.innerHeight / dims.h )
		const cropX = ( dims.w - window.innerWidth / cover ) / 2
		const cropY = ( dims.h - window.innerHeight / cover ) / 2
		const judge = function( id ){
			const el = document.getElementById( id )
			const box = el.getBoundingClientRect()
			if( !box.width ) return
			let sum = 0
			for( let i = 0; i <= 2; i++ ){
				for( let j = 0; j <= 2; j++ ){
					const x = cropX + ( box.left + box.width * ( 0.15 + 0.35 * i ) ) / cover
					const y = cropY + ( box.top + box.height * ( 0.15 + 0.35 * j ) ) / cover
					sum += engine.rgbToOklab( engine.hexToRgb( engine.colourAtPoint( x, y, dims.w, dims.h ) ) || [ 0, 0, 0 ] )[0]
				}
			}
			el.classList.toggle( "ink-dark", sum / 9 > 0.62 )
		}
		judgeCard = function(){ judge( "bio" ) }
		judge( "title" ); judge( "list" ); judge( "copy" ); judge( "bio" )
	}catch( fault ){
		/* No engine, no roll — the page stands on its dark ground in white.
			 Say so on the console: this catch once hid a broken sampler for a
			 whole release, because a page that still looks fine reports nothing. */
		console.warn( "WHL: engine unavailable, ink not judged —", fault.message )
	}
}
/* On a warm cache the iframe can finish loading before this script even
	 runs — its "load" has already fired, so a listener attached now would
	 never be called and the page would sit on its bare dark ground. Catch
	 that race: a document already "complete" gets rolled straight away. */
frame.addEventListener( "load", roll )
if( frame.contentDocument && frame.contentDocument.readyState === "complete" ) roll()
let settle
window.addEventListener( "resize", function(){
	clearTimeout( settle )
	settle = setTimeout( roll, 200 )
} )

/* The card folds like the tool's licence: the name toggles it open, the
	 door closes it. A judge only exists once the engine has rolled; before
	 that the card simply opens in the default white. */
const bio = document.getElementById( "bio" )
document.getElementById( "bioName" ).addEventListener( "click", function(){
	bio.classList.toggle( "hidden" )
	if( !bio.classList.contains( "hidden" ) && judgeCard ) judgeCard()
} )
document.getElementById( "bioClose" ).addEventListener( "click", function(){
	bio.classList.add( "hidden" )
} )

/* ── The title drift ──
	 Three letters on a one-dimensional track three logo-widths (21ch) long.
	 A small physics: velocity, drag, walls at the track ends, contact between
	 neighbours — the mover recoils, the struck letter is shoved on, which is
	 how an impulse walks through the trio. A performance is three kicks: each
	 letter finds its nerve once, in a shuffled order, a second or three apart,
	 so the later impulses land while the earlier ones still run — that is
	 where the collisions come from. Direction is free: kicked hard enough, a
	 letter that runs for a wall is thrown straight back into company, so
	 every path leads to a meeting (Hailei's insight, 2026-07-29). When all
	 the energy is spent — drag and every bounce eat it — the letters simply
	 rest where they stopped: no walk home, the next performance starts from
	 wherever this one ended. At rest the page runs nothing; each moving frame
	 writes three transforms and never touches layout. After a quiet random
	 while, the trio goes again. Three seconds after the page opens, the first
	 performance does. The leading semicolon is load-bearing: this file writes
	 no semicolons, and without it the opening parenthesis would swallow the
	 addEventListener line above as a call. */
;( function(){
	if( window.matchMedia && window.matchMedia( "(prefers-reduced-motion: reduce)" ).matches ) return
	const glyphs = document.querySelectorAll( "#title span" )
	const TRACK = 21                  /* the track, in ch — the 7ch logo three times over */
	const DRAG = 0.65                 /* s⁻¹ — how quickly motion starves */
	const WALL = 0.7                  /* speed kept when a track end throws a letter back */
	const REV = 0.55, PUSH = 0.75     /* contact: the mover recoils, the struck moves on */
	const EPS = 0.3, VMAX = 30        /* rest threshold and sanity cap, ch/s */
	const x = [ 0, 3, 6 ], v = [ 0, 0, 0 ]
	let ch = 7, last = null, running = false, queue = []
	function paint(){
		for( let i = 0; i < 3; i++ ) glyphs[i].style.transform = "translateX(" + ( x[i] * ch ).toFixed( 2 ) + "px)"
	}
	function contact( i, j ){
		if( v[i] - v[j] <= 0 ) return           /* not approaching — already parting */
		const gap = x[j] - x[i] - 1             /* every letter is 1ch wide */
		if( gap >= 0 ) return
		x[i] += gap / 2; x[j] -= gap / 2
		const a = v[i], b = v[j]
		v[i] = Math.max( -VMAX, Math.min( VMAX, -REV * a + PUSH * b ) )
		v[j] = Math.max( -VMAX, Math.min( VMAX, -REV * b + PUSH * a ) )
	}
	function step( now ){
		if( last === null ) last = now
		const dt = Math.min( ( now - last ) / 1000, 0.032 )
		last = now
		const starve = Math.exp( -DRAG * dt )
		for( let i = 0; i < 3; i++ ){ x[i] += v[i] * dt; v[i] *= starve }
		if( x[0] < 0 ){ x[0] = 0; v[0] = -v[0] * WALL }
		if( x[2] > TRACK - 1 ){ x[2] = TRACK - 1; v[2] = -v[2] * WALL }
		contact( 0, 1 ); contact( 1, 2 )
		paint()
		if( Math.abs( v[0] ) + Math.abs( v[1] ) + Math.abs( v[2] ) < EPS ){
			v[0] = v[1] = v[2] = 0
			running = false; last = null
			/* rest where they stopped; if the trio has kicks left, a pending
				 timer will wake the loop — otherwise book the next performance */
			if( !queue.length ) setTimeout( perform, 8000 + Math.random() * 14000 )
			return
		}
		requestAnimationFrame( step )
	}
	function kick(){
		ch = glyphs[0].getBoundingClientRect().width || ch
		v[ queue.shift() ] = ( Math.random() < 0.5 ? -1 : 1 ) * ( 16 + Math.random() * 10 )
		if( queue.length ) setTimeout( kick, 1000 + Math.random() * 2200 )
		if( !running ){ running = true; requestAnimationFrame( step ) }
	}
	function perform(){
		queue = [ 0, 1, 2 ]
		for( let i = 2; i > 0; i-- ){
			const j = Math.floor( Math.random() * ( i + 1 ) )
			const t = queue[i]; queue[i] = queue[j]; queue[j] = t
		}
		kick()
	}
	setTimeout( perform, 3000 )
} )()
</script>

</body>
</html>
